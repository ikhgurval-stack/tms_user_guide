site_name: E-Mart TMS Knowledge Base
site_description: TMS хэрэглэгчийн Монгол хэл дээрх гарын авлага
theme:
  name: material
  language: mn
  font: false
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.indexes
  - navigation.top
markdown_extensions:
- admonition
- attr_list
- md_in_html
plugins:
- search
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
not_in_nav: |
  /_templates/
  /index.md
  /planning/manual-plan.md
nav:
- TMS:
  - Ерөнхий: tms/index.md
  - Data Board:
    - Ерөнхий: tms/data-board.md
  - System Data:
    - Ерөнхий: tms/system-data.md
    - GPS ба бодит явсан зай: gps/index.md
  - Message Management:
    - Ерөнхий: tms/message-management.md
  - Vehicle Type Management:
    - Ерөнхий: tms/vehicle-type-management.md
  - Carrier Information:
    - Ерөнхий: tms/carrier-information.md
    - Тээвэрлэгч (Carrier): tms/carrier-information/carrier.md
    - Зогсоол (Parking Area): tms/carrier-information/parking-area.md
    - Ажилтны удирдлага (Employee Management): tms/carrier-information/employee-management.md
    - Тээврийн хэрэгслийн удирдлага (Vehicle Management): tms/carrier-information/vehicle-management.md
    - Түлшний карт (Fuel Card Management): tms/carrier-information/fuel-card-management.md
    - Хуваарийн загвар (Driver Schedule Template): tms/carrier-information/driver-schedule-template.md
    - Өдрийн хуваарь (Daily Schedule Board): tms/carrier-information/daily-schedule-board.md
    - Өдөр тутмын ажлын тохиргоо (Daily Task Configuration): tms/carrier-information/daily-task-configuration.md
    - Ажлын гүйцэтгэлийн бүртгэл (Daily Task Execution Record): tms/carrier-information/daily-task-execution-record.md
    - Үндсэн өгөгдөл бэлтгэх: getting-started/overview.md
  - Customer Information:
    - Ерөнхий: tms/customer-information.md
    - Харилцагчийн удирдлага (Client Management): tms/customer-information/client-management.md
    - Ачилтын цэг (Client Loading Point): tms/customer-information/client-loading-point.md
    - Хүргэлтийн цэг (Client Delivery Point): tms/customer-information/client-delivery-point.md
    - Тогтмол маршрут (Fixed Route): tms/customer-information/fixed-route.md
    - Бүсийн хуваарилалт (Region Division): tms/customer-information/region-division.md
  - Transportation Management:
    - Ерөнхий ойлголт: tms/transportation-management.md
    - Pickup Order: tms/transportation-management/pickup-order.md
    - Transport Order:
      - Тойм: transportation-order/overview.md
      - Шинээр үүсгэх: transportation-order/create-order.md
      - Импортлох: transportation-order/import-orders.md
      - Засварлах: transportation-order/edit-order.md
      - Цуцлах: transportation-order/cancel-order.md
      - Захиалгын төлөв: transportation-order/order-status.md
    - Quick Scheduling: planning/quick-scheduling.md
    - Route Scheduling: planning/route-scheduling.md
    - Smart Scheduling: planning/smart-plan.md
    - Transport Plan: planning/overview.md
    - Delivery Task:
      - Жагсаалт, нийтлэх, дэлгэрэнгүй: dispatch/publish.md
      - Тээврийн хэрэгсэл оноох: dispatch/assign-vehicle.md
      - Жолооч оноох: dispatch/assign-driver.md
    - Pickup Task: tms/transportation-management/pickup-task.md
    - Transportation Evaluation: tms/transportation-management/transportation-evaluation.md
  - Cost Management:
    - Ерөнхий: tms/cost-management.md
    - Carrier Freight Agreement: tms/cost-management/carrier-freight-agreement.md
    - Carrier Fee Bill: reference/cost-settlement.md
- RPT:
  - Ерөнхий: reports/index.md
- SYS:
  - Ерөнхий: sys/index.md
  - Platform System Management:
    - Ерөнхий: sys/platform-system-management.md
    - Business Organization: sys/business-organization.md
    - User Management: sys/user-management.md
    - Role Management: sys/role-management.md
  - General Data:
    - Ерөнхий: sys/general-data.md
    - System Options: sys/system-options.md
    - Data Dictionary: sys/data-dictionary.md
- Mini App:
  - Ерөнхий: mini-app/index.md
  - Нэвтрэх мэдээлэл: getting-started/login.md
  - Driver App:
    - Ерөнхий: mini-app/driver-app.md
    - Ачилт, хүргэлт, сав буцаан татах: execution/index.md
  - Store App:
    - Ерөнхий: mini-app/store-app.md
    - Хүлээн авалт ба тээврийн үнэлгээ: execution/store-app.md
- Бусад:
  - Ерөнхий: other/index.md
  - Гарын авлагын чиглүүлэг: getting-started/navigation.md
  - Нэр томьёо: reference/index.md
  - Төлөвийн лавлах: reference/status-reference.md
  - Тестээр баталгаажсан ажиллагаа: reference/business-rules.md
  - Тестийн оролцогчид: reference/user-roles.md
  - End-to-End процесс: tutorials/order-to-delivery.md
  - Алдаа шийдвэрлэх / Known Issues: troubleshooting/index.md
  - Түгээмэл асуулт: faq/index.md
  - Test Case:
    - TC-B2C-E2E-001: testing/tc-b2c-e2e-001.md
